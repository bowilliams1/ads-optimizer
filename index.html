<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://nrncnnfdhymtjxajzlas.supabase.co wss://nrncnnfdhymtjxajzlas.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<title>BOSH Ads Optimizer</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Copied from the approved mockup v1.2 (D-ADS-26); tokens = live Command Center (13.4).
   Layout: Command Center shell (left menu + header + panels), dark only, one page per menu item.
   Tokens copied exactly from the live Command Center (BUILD_INSTRUCTIONS 13.4). Colour carries meaning:
   green = fine, amber = watch, red = act, blue = information. */
:root{
  color-scheme:dark;
  --bg:#090e0c; --sb:#0a100e;
  --panel:#0e1512; --panel-2:#121b17; --panel-3:#16211c;
  --border:#1b2621; --border-2:#26332c;
  --text:#e8eeeb; --text-2:#aab5b0; --text-3:#8a9791; --text-4:#7a8781;
  --green:#3fb950; --green-hi:#56d364; --green-wash:rgba(63,185,80,.12); --green-edge:rgba(63,185,80,.45);
  --amber:#e3a33b; --amber-wash:rgba(227,163,59,.12);
  --red:#f0524f; --red-wash:rgba(240,82,79,.12);
  --blue:#4c9aff; --blue-wash:rgba(76,154,255,.12);
  --track:#1f2c26; --on-amber:#1c1405; --on-green:#ffffff;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; --sbw:236px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--text);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
[hidden]{display:none!important}
.ic{flex:none;display:block}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}

/* sidebar */
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px 16px;background:var(--sb);border-right:1px solid var(--border);overflow-y:auto}
.brand{padding:6px 8px 18px}
.brand img{display:block;width:198px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.brand .mark{display:none}
.brand .sub{display:block;margin:10px 2px 0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--text-2);text-decoration:none;font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.nav a .ic{color:var(--text-3)}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav a.active{background:linear-gradient(180deg,#2e9a40,#237d33);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 18px rgba(46,154,64,.28)}
.nav a.active .ic{color:#fff}
.nav .sep{height:1px;background:var(--border);margin:10px 8px}
.nav .lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);padding:4px 12px}
.nav a.later{color:var(--text-4)}
.tag{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.05);color:var(--text-3)}
.badge{margin-left:auto;min-width:21px;height:19px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;font-size:11px;font-weight:700}
.badge.crit{background:var(--red);color:#fff}
.badge.warn{background:var(--amber);color:var(--on-amber)}
.badge.fyi{background:var(--panel-3);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border-2)}
.grow{flex:1}
.status{padding:13px 14px;border:1px solid var(--border);border-radius:var(--r);background:var(--panel);font-size:12px}
.status .h{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2);margin-bottom:8px}
.status .line{display:flex;align-items:center;gap:8px;color:var(--green-hi);margin-bottom:6px}
.status .line.warn{color:var(--amber)}
.status .line i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:none}
.status .skv{display:flex;justify-content:space-between;gap:8px;color:var(--text-3);padding:2px 0}
.status .skv b{color:var(--text-2);font-weight:500;text-align:right}
.user{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--border);border-radius:var(--r);background:var(--panel)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel-3);border:1px solid var(--border-2);font-weight:600;flex:none}
.user .who{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.user b{font-weight:600;font-size:13px}
.user span{font-size:11.5px;color:var(--text-3)}

/* main */
.main{min-width:0;display:flex;flex-direction:column}
.sample{display:flex;align-items:center;gap:10px;padding:9px 26px;background:var(--amber-wash);border-bottom:1px solid rgba(227,163,59,.35);color:#eec27a;font-size:12.5px}
.sample b{color:var(--amber);letter-spacing:.06em}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;padding:18px 26px 12px}
.ttl{min-width:0;flex:1 1 320px}
.ttl h1{margin:0;font-size:24px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.ttl p{margin:5px 0 0;color:var(--text-3);font-size:12.5px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 11px;color:var(--text-2);font-size:12.5px;font-weight:500}
.seg button + button{border-left:1px solid var(--border-2)}
.seg button[aria-pressed="true"]{background:var(--panel-3);color:var(--text);box-shadow:inset 0 -2px 0 var(--green)}
.tog{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--border-2);border-radius:9px;background:var(--panel);color:var(--text-2);font-size:12.5px;font-weight:500}
.tog .sw{width:28px;height:16px;border-radius:9px;background:var(--track);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text-3);transition:transform .15s,background .15s}
.tog[aria-pressed="true"]{color:var(--text)}
.tog[aria-pressed="true"] .sw{background:var(--green-edge)}
.tog[aria-pressed="true"] .sw::after{transform:translateX(12px);background:var(--green-hi)}
.view{padding:0 26px 40px;min-width:0}
.page{display:flex;flex-direction:column;gap:14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px dashed rgba(76,154,255,.45);border-radius:var(--r);background:var(--blue-wash);color:#b9d5ff;font-size:12.5px}
.note .ic{color:var(--blue);margin-top:1px}
.note b{color:var(--text)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{display:flex;flex-direction:column;gap:3px;padding:15px 16px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);min-width:0}
.kl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.kv{font-size:23px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kv small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:5px}
.ks{font-size:12px;color:var(--text-3)}
.ks.good{color:var(--green-hi)} .ks.crit{color:#f59b99} .ks.warn{color:#eec27a}
.kd{margin-top:4px;padding-top:7px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-4)}
.kpi.hero{grid-column:span 2;border-color:var(--green-edge);background:linear-gradient(180deg,rgba(63,185,80,.07),rgba(63,185,80,0) 70%),var(--panel)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;line-height:1.4}
.chip.good{color:var(--green-hi);background:var(--green-wash)}
.chip.warn{color:#eec27a;background:var(--amber-wash)}
.chip.crit{color:#f59b99;background:var(--red-wash)}
.chip.info{color:#9cc4ff;background:var(--blue-wash)}
.chip.off{color:var(--text-3);background:rgba(255,255,255,.05)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* panels */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.span2{grid-column:span 2}
.pn{display:flex;flex-direction:column;min-width:0;padding:16px 18px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-height:24px}
.ph h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.ph .sub{font-size:12px;color:var(--text-3)}
.ph .sp{flex:1}
.link{background:none;border:0;padding:0;color:var(--blue);font-size:12.5px;font-weight:500;white-space:nowrap}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.pf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:11px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.lr:last-child{border-bottom:0}
.lt{min-width:0}
.lt b{display:block;font-weight:600;font-size:13px}
.lt span{display:block;font-size:12px;color:var(--text-3)}
.lm{text-align:right;font-size:12.5px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.lm small{display:block;font-size:11.5px;color:var(--text-3)}
.sev{width:4px;align-self:stretch;border-radius:3px;background:var(--text-4)}
.sev.crit{background:var(--red)} .sev.warn{background:var(--amber)} .sev.info{background:var(--blue)}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text-3);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--track)}
.mix span{display:block;height:100%}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:var(--panel-2);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
th.grp{background:var(--panel-3);color:var(--text-2);text-align:center;border-bottom:1px solid var(--border-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:var(--panel-2);font-weight:600;border-top:1px solid var(--border-2);border-bottom:0}
.nm b{display:block;font-weight:600}
.nm span{display:block;font-size:11px;color:var(--text-4)}
.na{color:var(--text-4)}
.up{color:#f59b99} .down{color:var(--green-hi)}
.yoy{display:none}
body.yoy-on .yoy{display:table-cell}
body.yoy-on .yoy.blk{display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{padding:7px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel);color:var(--text-2);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--border-2);z-index:31;overflow-y:auto;padding:20px 22px 30px;display:flex;flex-direction:column;gap:14px;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.drawer > *{flex-shrink:0}
.drawer h3{margin:0;font-size:18px;font-weight:600}
.drawer .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text-2);display:grid;place-items:center}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kc{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2)}
.kc span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.kc b{display:block;margin-top:2px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kv-list{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:12.5px}
.kv-list dt{color:var(--text-3)}
.kv-list dd{margin:0;color:var(--text)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--text-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--green)}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;font-size:12.5px;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--panel-2)}
.calc span{color:var(--text-2)}
.calc b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.calc .tot{border-top:1px solid var(--border-2);padding-top:6px;margin-top:2px}
.calc .tot span,.calc .tot b{color:var(--text);font-weight:600}

/* action center */
.ac-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keys{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12px;color:var(--text-3)}
kbd{display:inline-block;min-width:20px;padding:1px 6px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:5px;background:var(--panel-2);color:var(--text);font:600 11px/1.5 var(--font);text-align:center;margin-right:4px}
.grp-h{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.grp-h h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.grp-h .sub{font-size:12px;color:var(--text-3)}
.prop{display:grid;grid-template-columns:24px minmax(0,1.7fr) minmax(0,1.25fr) auto;gap:14px;align-items:start;padding:13px 14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);transition:border-color .15s,background .15s}
.prop:focus{outline:none;border-color:var(--green-edge);box-shadow:0 0 0 1px var(--green-edge)}
.prop.sel-on{background:var(--panel-2)}
.prop.done{opacity:.6}
.prop.done:focus{opacity:1}
.prop input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;accent-color:var(--green)}
.p-what{min-width:0;display:flex;flex-direction:column;gap:4px}
.p-act{font-weight:600;font-size:13.5px}
.p-ent{font-size:12px;color:var(--text-3)}
.p-ent code{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-4)}
.p-why{font-size:12.5px;color:var(--text-2)}
.p-safe{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.p-vals{display:grid;grid-template-columns:auto auto;gap:4px 12px;align-content:start;font-size:12.5px;min-width:0}
.p-vals dt{color:var(--text-3)}
.p-vals dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500}
.p-vals dd.prop-v{color:var(--green-hi)}
.mine{width:96px;padding:5px 8px;border:1px solid var(--border-2);border-radius:7px;background:var(--panel-2);color:var(--text);font-variant-numeric:tabular-nums}
.mine:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px var(--green-wash)}
.mine.bad{border-color:var(--red)}
.p-btns{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:118px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#34443b}
.btn.go{background:linear-gradient(180deg,#2e9a40,#237d33);border-color:#2e9a40;color:#fff}
.btn.go:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.p-state{font-size:12px;font-weight:600}
.p-msg{grid-column:2 / -1;font-size:12px;padding:8px 10px;border-radius:8px}
.p-msg.crit{background:var(--red-wash);color:#f59b99}
.p-more{grid-column:2 / -1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:10px;border-top:1px dashed var(--border-2);font-size:12px;color:var(--text-2)}
.p-more h4{margin:0 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.bulkbar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--green-edge);border-radius:var(--r);background:rgba(14,21,18,.96);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bulkbar .sp{flex:1}
.phone-ro{display:none}
.drops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;border:1.5px dashed var(--border-2);border-radius:var(--r);color:var(--text-3);font-size:12.5px;text-align:center}
.drop b{color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;background:var(--panel-3);border:1px solid var(--border-2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:41;padding:16px}
.modal .box{width:min(520px,100%);padding:20px 22px;border:1px solid var(--border-2);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:16px}

/* health */
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hc .ph{margin-bottom:8px}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.hrow:last-child{border-bottom:0}
.hrow span{color:var(--text-3)}
.hrow b{font-weight:500;text-align:right}

.later-pg{padding:28px;border:1px dashed var(--border-2);border-radius:var(--r);color:var(--text-2);max-width:760px}
.later-pg h2{margin:0 0 8px;font-size:16px}
.later-pg ul{margin:8px 0 0;padding-left:18px}

@media (max-width:1280px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:span 2}.prop{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr)}.p-btns{grid-column:2 / -1;flex-direction:row;flex-wrap:wrap}.p-more{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){
  :root{--sbw:76px}
  .sb{padding:16px 10px}
  .brand{padding:4px 0 14px}
  .brand .full,.brand .sub{display:none}
  .brand .mark{display:block;width:56px;height:56px}
  .nav a > span:not(.badge),.nav a .tag,.nav .lbl,.status,.user .who{display:none}
  .nav a{justify-content:center;padding:11px 0}
  .badge{position:absolute;top:2px;right:4px;margin:0;min-width:17px;height:17px;font-size:10px}
  .user{justify-content:center;padding:8px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px 12px}
  .brand{padding:0 8px 0 0}
  .brand .full{display:block;width:110px}
  .brand .mark{display:none}
  .nav{flex-direction:row;gap:3px}
  .nav a{padding:9px 9px}
  .nav .sep,.grow,.user{display:none}
  .badge{top:0;right:0}
  .sample{padding:9px 16px}
  .top{padding:14px 16px 10px}
  .view{padding:0 16px 32px}
  .kpis,.grid,.hgrid,.drops,.kgrid{grid-template-columns:minmax(0,1fr)}
  .kpi.hero,.span2{grid-column:auto}
  .prop{grid-template-columns:24px minmax(0,1fr)}
  .p-vals,.p-btns{grid-column:2}
  .p-more{grid-column:1 / -1}
  .keys,.bulkbar,.prop input[type=checkbox],.p-btns .btn,.p-vals .mine,.p-vals label,#shadowTog,.drops,.ac-head .tog{display:none}
  .phone-ro{display:flex!important}
  .prop{grid-template-columns:minmax(0,1fr)}
  .p-vals,.p-btns{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;padding:26px 24px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}
.login img{width:200px;height:auto;align-self:center;filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.login .sub{align-self:center;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin-top:-6px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-2);font-weight:500}
.login input{padding:10px 12px;border:1px solid var(--border-2);border-radius:9px;background:var(--panel-2);color:var(--text)}
.login input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px var(--green-wash)}
.login .err{font-size:12.5px;color:#f59b99;min-height:18px}
.loading{padding:40px 26px;color:var(--text-3)}
.empty{padding:22px;border:1px dashed var(--border-2);border-radius:var(--r);color:var(--text-2);max-width:820px}
.empty h2{margin:0 0 8px;font-size:15px}
.empty ul{margin:8px 0 0;padding-left:18px}
.shadowbar{display:flex;align-items:center;gap:10px;padding:9px 26px;background:var(--blue-wash);border-bottom:1px solid rgba(76,154,255,.35);color:#b9d5ff;font-size:12.5px}
.shadowbar b{color:var(--blue);letter-spacing:.06em}
@media (max-width:760px){.shadowbar{padding:9px 16px}}
</style>
</head>

    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>

    <button class="btn go" type="submit" id="loginBtn">Sign in</button>

</div>

<div class="app" id="app" hidden>

</div>
